<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakina Planner — Le planner qui réconcilie ta dunya et ton dîn</title>
<meta name="description" content="Sakina Planner, par Bayt Al Sakina — organise ta vie scolaire ou professionnelle sans jamais perdre ta vie spirituelle de vue.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ivory: #FAF7F2;
  --cream: #F3EDE3;
  --cream-deep: #EBE3D5;
  --rose: #E8C8BC;
  --rose-deep: #D4A090;
  --sage: #A8B89A;
  --sage-light: #C8D4BF;
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --taupe: #8C7B6B;
  --text: #3D322A;
  --text-light: #7A6A5A;
  --blue-mist: #B8C8D4;
  --white: #FFFFFF;
  --accent: #D4A090;
}

/* THEME SWATCHES (signature) */
.swatches {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 28px 0 8px;
  opacity: 0;
  animation: fadeUp 0.8s ease 1.1s forwards;
}
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .2s ease, border-color .2s ease;
  position: relative;
}
.swatch:hover { transform: translateY(-2px); }
.swatch.active { border-color: var(--text); }
.swatch.active::after {
  content: "✓"; position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; color: #fff; font-size: 11px;
}
.swatch-label {
  font-size: 11px; color: var(--text-light); letter-spacing: 0.3px;
  opacity: 0; animation: fadeUp 0.8s ease 1.15s forwards;
}
.swatch-label b { color: var(--accent); transition: color .3s ease; }

html { scroll-behavior: smooth; }
em { transition: color .3s ease; }

body {
  background: var(--ivory);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
}

/* NAV */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 20px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(250,247,242,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gold-light);
}

.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  text-decoration: none;
}

.nav-logo span { color: var(--gold); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
  list-style: none;
}

.nav-links a {
  font-size: 13px;
  color: var(--text-light);
  text-decoration: none;
  letter-spacing: 0.3px;
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--gold); }

.nav-cta {
  padding: 10px 24px;
  background: var(--text);
  color: var(--ivory) !important;
  border-radius: 100px;
  font-size: 13px !important;
  transition: background 0.2s !important;
}

.nav-cta:hover { background: var(--taupe) !important; color: var(--ivory) !important; }

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 24px 80px;
  position: relative;
  overflow: hidden;
}

.hero-bg-orb-1 {
  position: absolute;
  top: 10%;
  right: -5%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--gold-light) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.35;
  pointer-events: none;
}

.hero-bg-orb-2 {
  position: absolute;
  bottom: 5%;
  left: -8%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--rose) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.3;
  pointer-events: none;
}

.hero-bg-orb-3 {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--sage-light) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.15;
  pointer-events: none;
}

.hero-inner {
  position: relative;
  z-index: 1;
  max-width: 720px;
}

.hero-brand {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(20px, 3vw, 26px);
  letter-spacing: 0.04em;
  color: var(--taupe);
  margin-bottom: 18px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0s forwards;
}
.hero-brand span { color: var(--gold); }

.hero-ayah {
  font-family: 'Amiri', serif;
  font-size: 26px;
  color: var(--gold);
  direction: rtl;
  line-height: 1.8;
  margin-bottom: 8px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.2s forwards;
}

.hero-ref {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.4s forwards;
}

.hero-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  justify-content: center;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.5s forwards;
}

.hero-divider-line {
  width: 60px;
  height: 1px;
  background: var(--gold-light);
}

.hero-divider-dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 6vw, 62px);
  font-weight: 300;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.6s forwards;
}

.hero-title em {
  font-style: italic;
  color: var(--accent);
}

.hero-subtitle {
  font-size: 16px;
  color: var(--text-light);
  line-height: 1.75;
  max-width: 480px;
  margin: 0 auto 40px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.8s forwards;
}

.hero-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 0.8s ease 1s forwards;
}

.btn-primary {
  padding: 14px 32px;
  background: var(--text);
  color: var(--ivory);
  border: none;
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  display: inline-block;
}

.btn-primary:hover { background: var(--taupe); transform: translateY(-1px); }

.btn-outline {
  padding: 13px 32px;
  background: transparent;
  color: var(--text);
  border: 1.5px solid var(--gold-light);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  display: inline-block;
}

.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

.hero-badge {
  margin-top: 48px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: white;
  border: 1px solid var(--gold-light);
  border-radius: 100px;
  padding: 10px 20px;
  font-size: 12px;
  color: var(--text-light);
  opacity: 0;
  animation: fadeUp 0.8s ease 1.2s forwards;
}

.badge-dot {
  width: 8px;
  height: 8px;
  background: var(--sage);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* SECTIONS COMMUNES */
.section-wrap {
  padding: 96px 24px;
  max-width: 1000px;
  margin: 0 auto;
}

.section-eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
  text-align: center;
}

.section-heading {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 300;
  color: var(--text);
  text-align: center;
  line-height: 1.2;
  margin-bottom: 16px;
}

.section-heading em { font-style: italic; color: var(--accent); }

.section-sub {
  font-size: 15px;
  color: var(--text-light);
  text-align: center;
  line-height: 1.75;
  max-width: 520px;
  margin: 0 auto 56px;
}

/* PROBLÈME */
.problem-section {
  background: var(--cream);
  padding: 96px 24px;
}

.problem-inner {
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
}

.problem-quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 3.5vw, 36px);
  font-weight: 300;
  font-style: italic;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 32px;
  position: relative;
  padding: 0 32px;
}

.problem-quote::before {
  content: '"';
  font-size: 80px;
  color: var(--gold-light);
  position: absolute;
  top: -20px;
  left: 0;
  font-family: 'Cormorant Garamond', serif;
  line-height: 1;
}

.problem-tags {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 40px;
}

.problem-tag {
  padding: 8px 18px;
  background: white;
  border: 1px solid var(--rose);
  border-radius: 100px;
  font-size: 13px;
  color: var(--text-light);
}

/* SOLUTION */
.solution-block {
  background: var(--text);
  border-radius: 28px;
  padding: 56px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
}

.solution-block::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -60px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
  opacity: 0.15;
  border-radius: 50%;
}

.solution-arabic {
  font-family: 'Amiri', serif;
  font-size: 22px;
  color: var(--gold);
  direction: rtl;
  margin-bottom: 24px;
  line-height: 1.8;
}

.solution-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 300;
  color: var(--ivory);
  line-height: 1.25;
  margin-bottom: 20px;
}

.solution-title em { color: var(--gold); font-style: italic; }

.solution-body {
  font-size: 15px;
  color: rgba(250,247,242,0.7);
  line-height: 1.8;
  max-width: 520px;
  margin: 0 auto;
}

/* FEATURES */
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}

.feature-card {
  background: white;
  border-radius: 24px;
  padding: 36px 32px;
  border: 1px solid var(--cream-deep);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.feature-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(61,50,42,0.08);
}

.feature-icon {
  font-size: 28px;
  margin-bottom: 16px;
  display: block;
}

.feature-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 10px;
}

.feature-desc {
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.7;
}

.feature-tag {
  display: inline-block;
  margin-top: 14px;
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.tag-spiritual { background: var(--sage-light); color: var(--text); }
.tag-planning { background: var(--gold-light); color: var(--text); }
.tag-school { background: var(--blue-mist); color: var(--text); }
.tag-special { background: var(--rose); color: var(--text); }

/* APERÇU APP */
.app-preview {
  background: var(--cream);
  padding: 96px 24px;
}

.preview-window {
  background: white;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(61,50,42,0.12);
  max-width: 800px;
  margin: 0 auto;
  border: 1px solid var(--cream-deep);
}

.preview-bar {
  background: var(--cream);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--cream-deep);
}

.preview-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.preview-url {
  flex: 1;
  background: white;
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  color: var(--text-light);
  margin: 0 12px;
  border: 1px solid var(--cream-deep);
}

.preview-content {
  padding: 32px;
}

/* Dashboard preview */
.dash-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 28px;
}

.dash-greeting {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  color: var(--text);
  font-weight: 300;
}

.dash-greeting em { color: var(--accent
